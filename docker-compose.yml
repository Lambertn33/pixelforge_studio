services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixelforgestudio-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  vite:
    image: node:22
    container_name: pixelforgestudio-vite
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - pixelforgestudio-node-modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: pixelforgestudio-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: pixelforgestudio
      MYSQL_USER: pixelforgestudio
      MYSQL_PASSWORD: pixelforgestudio
      MYSQL_ROOT_PASSWORD: pixelforgestudio
    volumes:
      - pixelforgestudio-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: pixelforgestudio-redis
    ports:
      - "6380:6379"
    volumes:
      - pixelforgestudio-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pixelforgestudio-mysql:
  pixelforgestudio-redis:
  pixelforgestudio-node-modules:
