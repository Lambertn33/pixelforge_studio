x-app-environment: &app-environment
  APP_URL: http://localhost:8001
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: pixelforgestudio
  DB_USERNAME: pixelforgestudio
  DB_PASSWORD: pixelforgestudio
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: database
  PIXELFORGE_BASE_URL: ${PIXELFORGE_BASE_URL:-https://pixelforge.promptedit.dev/v1}
  PIXELFORGE_API_KEY: ${PIXELFORGE_API_KEY:-}
  PIXELFORGE_WEBHOOK_SECRET: ${PIXELFORGE_WEBHOOK_SECRET:-}
  SCOUT_DRIVER: ${SCOUT_DRIVER:-typesense}
  TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-pixelforgestudio}
  TYPESENSE_HOST: typesense
  TYPESENSE_PORT: 8108
  TYPESENSE_PROTOCOL: http

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - .:/var/www/html
  environment:
    <<: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    typesense:
      condition: service_healthy

services:
  app:
    <<: *app-service
    container_name: pixelforgestudio-app
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  queue:
    <<: *app-service
    container_name: pixelforgestudio-queue
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
    restart: unless-stopped

  scheduler:
    <<: *app-service
    container_name: pixelforgestudio-scheduler
    command: php artisan schedule:work
    restart: unless-stopped

  vite:
    image: node:22
    container_name: pixelforgestudio-vite
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - pixelforgestudio-node-modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: pixelforgestudio-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: pixelforgestudio
      POSTGRES_USER: pixelforgestudio
      POSTGRES_PASSWORD: pixelforgestudio
    volumes:
      - pixelforgestudio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelforgestudio -d pixelforgestudio"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: pixelforgestudio-redis
    ports:
      - "6381:6379"
    volumes:
      - pixelforgestudio-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  typesense:
    image: typesense/typesense:30.2
    container_name: pixelforgestudio-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-pixelforgestudio}
    volumes:
      - pixelforgestudio-typesense:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pixelforgestudio-postgres:
  pixelforgestudio-redis:
  pixelforgestudio-node-modules:
  pixelforgestudio-typesense:
